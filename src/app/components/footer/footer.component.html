              <circle class="namp-spark" cx="150.5" cy="27.9" r="1.3" opacity="0.09" fill="#d4af37" stroke="none" />
            </g>
            <circle class="namp-node" cx="100" cy="188" r="5" fill="#d4af37" />
            <circle class="namp-node-core" cx="100" cy="188" r="2.1" />
          </g>

          <g class="namp-ring namp-ring--inner">
            <g class="namp-comet" stroke="#10b981">

            <circle class="namp-node-core" cx="100" cy="158" r="2.1" />
          </g>

          <g class="namp-orbit" transform="rotate(-18 100 100)">
            <path class="namp-orbit-path" d="M14 100a86 34 0 1 0 172 0a86 34 0 1 0 -172 0"
              stroke="var(--border)" stroke-width="1" />
            <circle class="namp-orbit-node namp-orbit-node--t4" r="1.2" />
            <circle class="namp-orbit-node namp-orbit-node--t3" r="1.9" />
            <circle class="namp-orbit-node namp-orbit-node--t2" r="2.7" />
            <circle class="namp-orbit-node namp-orbit-node--t1" r="3.5" />
            <circle class="namp-orbit-node" r="4.5" />

            <path class="namp-logo-n" d="M68 136V64l64 72V64" pathLength="240"
              stroke="var(--text)" stroke-width="20" />
            <path class="namp-constellation"
              d="M44 58 L35 73 L45 96 L56 118 L48 143 L72 160 L100 168 L128 160 L152 140 L163 96" />

        <span class="namp-badge-text">

          <small>namp.cl</small>
