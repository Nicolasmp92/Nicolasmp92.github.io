<div id="app-root">

  <!-- MENU SUPERIOR -->
  <mat-toolbar color="primary" [ngClass]="{'shrink': shrinkToolbar}"
    #toolbar class="navbar navbar-expand-lg sticky-top">
    <div class="navbar-inner">

      <!-- CENTER: nav links (collapses on mobile) -->
      <nav class="collapse navbar-collapse navbar-center" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item" *ngFor="let link of navigationLinks">
            <a class="nav-link"
              [ngClass]="{'active': activeSection === link.section}"
              [routerLink]="link.path"
              (click)="scrollToSection(link.section); collapseNavbarResponsive()"
              ariaCurrentWhenActive="page"
              mat-button>
              {{ link.label }}
            </a>
          </li>
        </ul>
      </nav>

      <!-- RIGHT: accessibility + mobile hamburger -->
      <div class="navbar-right">
        <div class="a11y-wrap">
          <button class="a11y-btn" (click)="toggleA11y()"
            [ngClass]="{'active': isA11yOpen}"
            aria-label="Opciones de accesibilidad">
            <mat-icon>{{ isA11yOpen ? 'close' : 'accessibility_new' }}</mat-icon>
          </button>
          <div class="a11y-panel" [ngClass]="{'show': isA11yOpen}">
            <div class="a11y-font-row">
              <button class="a11y-ctl" (click)="decreaseFont()" [disabled]="fontScale <= FONT_MIN" aria-label="Reducir tamaño de fuente">
                <mat-icon>text_decrease</mat-icon>
              </button>
              <span class="a11y-value">{{ fontPercent }}%</span>
              <button class="a11y-ctl" (click)="increaseFont()" [disabled]="fontScale >= FONT_MAX" aria-label="Aumentar tamaño de fuente">
                <mat-icon>text_increase</mat-icon>
              </button>
              <button class="a11y-ctl" (click)="resetFont()" [disabled]="fontScale === 1" aria-label="Restablecer tamaño de fuente">
                <mat-icon>restart_alt</mat-icon>
              </button>
            </div>
            <span class="a11y-sep-h"></span>

            <button class="a11y-toggle" (click)="themeService.toggle()" [class.on]="!themeService.isDark">
              <mat-icon>light_mode</mat-icon>
              <span>Modo claro</span>
              <mat-icon class="a11y-state">{{ !themeService.isDark ? 'toggle_on' : 'toggle_off' }}</mat-icon>
            </button>
            <button class="a11y-toggle" (click)="toggleA11yOption('highContrast')" [class.on]="highContrast">
              <mat-icon>invert_colors</mat-icon>
              <span>Alto contraste</span>
              <mat-icon class="a11y-state">{{ highContrast ? 'toggle_on' : 'toggle_off' }}</mat-icon>
            </button>
            <button class="a11y-toggle" (click)="toggleA11yOption('easyRead')" [class.on]="easyRead">
              <mat-icon>format_line_spacing</mat-icon>
              <span>Lectura fácil</span>
              <mat-icon class="a11y-state">{{ easyRead ? 'toggle_on' : 'toggle_off' }}</mat-icon>
            </button>
            <button class="a11y-toggle" (click)="toggleA11yOption('reduceMotion')" [class.on]="reduceMotion">
              <mat-icon>motion_photos_off</mat-icon>
              <span>Reducir animaciones</span>
              <mat-icon class="a11y-state">{{ reduceMotion ? 'toggle_on' : 'toggle_off' }}</mat-icon>
            </button>
            <button class="a11y-toggle" (click)="toggleA11yOption('underlineLinks')" [class.on]="underlineLinks">
              <mat-icon>format_underlined</mat-icon>
              <span>Subrayar enlaces</span>
              <mat-icon class="a11y-state">{{ underlineLinks ? 'toggle_on' : 'toggle_off' }}</mat-icon>
            </button>
            <button class="a11y-toggle" (click)="toggleA11yOption('bigCursor')" [class.on]="bigCursor">
              <mat-icon>mouse</mat-icon>
              <span>Cursor grande</span>
              <mat-icon class="a11y-state">{{ bigCursor ? 'toggle_on' : 'toggle_off' }}</mat-icon>
            </button>
            <button class="a11y-toggle" (click)="toggleA11yOption('readingGuide')" [class.on]="readingGuide">
              <mat-icon>straighten</mat-icon>
              <span>Guía de lectura</span>
              <mat-icon class="a11y-state">{{ readingGuide ? 'toggle_on' : 'toggle_off' }}</mat-icon>
            </button>
          </div>
        </div>
        <button aria-label="Menu dispositivos móviles"
          class="navbar-toggler mat-menu"
          mat-icon-button type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <mat-icon>menu</mat-icon>
        </button>
      </div>

    </div>
  </mat-toolbar>

  <app-home></app-home>
  <app-about></app-about>
  <app-experience></app-experience>
  <app-skills></app-skills>
  <app-contact></app-contact>

  <app-footer></app-footer>

  <!-- Floating contact card (bottom-left) -->
  <div class="contact-float-wrap">
    <div class="contact-float-backdrop" [ngClass]="{'show': isContactCardOpen}" (click)="toggleContactCard()"></div>
    <div class="contact-float-card" [ngClass]="{'show': isContactCardOpen}">
      <div class="contact-float-profile">
        <div class="contact-float-img-wrap">
          <img class="contact-float-img" src="img/MiFotoDePerfil.jpg" alt="Foto de perfil de Nicolás Muñoz">
        </div>
        <p class="sidenav-name">Nicolás Muñoz</p>
        <span class="role-badge">Full Stack Dev</span>
      </div>
      <ul class="contact-info">
        <li>
          <button class="btn-contact" (click)="navigateTo('tel:+56963978090')">
            <mat-icon>call</mat-icon>
            <span class="contact-text">+569 63978090</span>
          </button>
        </li>
        <li>
          <button class="btn-contact" (click)="navigateTo('tel:+56962308757')">
            <mat-icon>call</mat-icon>
            <span class="contact-text">+569 62308757</span>
          </button>
        </li>
        <li>
          <button class="btn-contact" (click)="navigateTo('mailto:nikolasmp92@gmail.com')">
            <mat-icon>email</mat-icon>
            <span class="contact-text">nikolasmp92&#64;gmail.com</span>
          </button>
        </li>
        <li>
          <button class="btn-contact" (click)="navigateTo('https://maps.app.goo.gl/7eTzs1oybKFieuNt7')">
            <mat-icon>location_on</mat-icon>
            <span class="contact-text">Coltauco, O'Higgins</span>
          </button>
        </li>
        <li>
          <button class="btn-contact">
            <mat-icon>cake</mat-icon>
            <span class="contact-text">14 de enero de 1992</span>
          </button>
        </li>
      </ul>
    </div>
    <button class="contact-float-btn" (click)="toggleContactCard()"
      [ngClass]="{'active': isContactCardOpen}"
      aria-label="Tarjeta de contacto">
      <mat-icon>{{ isContactCardOpen ? 'close' : 'contact_page' }}</mat-icon>
    </button>
  </div>

  <!-- Reading guide ruler -->
  <div *ngIf="readingGuide" class="a11y-reading-guide" [style.top.px]="guideY"></div>

</div>
